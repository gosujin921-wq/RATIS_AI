    RATIS 공식 CI — 원본 그대로다. 손으로 그린 근사본이 아니다.

    출처: 방사선기술정보시스템 CI 안내 페이지의 AI 원본(ci_file_ai.ai)을 벡터 그대로 SVG 로 변환.
      ratis.or.kr → RATIS 소개 → CI → 「AI 다운로드」
    글자는 전부 패스로 떨어져 있어 서체 설치 여부와 무관하게 같은 모양으로 나온다.

    지정 색 (CI 페이지 고시값 / 실제 원본 파일값)
      · Blue  #273996 / #283a97
      · Green #91c73d / #92c83e
      원본 파일값을 그대로 둔다. 고시값에 맞춘다고 고쳐 칠하지 않는다.

    ⚠ 옆에 붙는 「AI」가 이 기하에 맞춰 정렬된다 — 파일을 갈면 아래 세 값을 같이 고친다.
      · viewBox 폭 244 · 높이 128.75 (AppShell.css 의 폭 계산식이 이 비율을 쓴다)
      · RATIS 레터 밑선 y=106.75 (뷰박스 상단 기준). AI 의 베이스라인을 여기에 맞춘다
      · 상단 흩어진 사각형과 하단 국문 부제까지 포함한 박스다 (여백 없음)
